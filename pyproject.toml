[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thot"
dynamic = ["version"]
description = "Offline speech-to-text: batch transcription with Whisper, speaker labels and live dictation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Giulio Castellano" }]
keywords = ["speech-to-text", "transcription", "whisper", "vosk", "diarization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1",
    "av>=11",
    "numpy",
    "librosa>=0.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
live = ["vosk>=0.3.45", "sounddevice>=0.4"]
grammar = ["transformers>=4.40", "torch", "sentencepiece"]
all = ["thot[gui,live,grammar]"]
dev = ["pytest>=8"]

[project.scripts]
thot = "thot.cli.main:main"

[project.gui-scripts]
thot-gui = "thot.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "thot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thot = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
